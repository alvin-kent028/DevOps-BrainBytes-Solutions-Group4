global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: development

rule_files:
  - 'alert_rules.yml'
  - 'recording_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'brainbytes-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:5000']
        labels:
          service: brainbytes-backend
          environment: development
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: false
    sample_limit: 25000
    target_limit: 10000
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):5000'
        target_label: instance
        replacement: '$1:5000'
      - source_labels: [job]
        target_label: prometheus_job
      - source_labels: [__scheme__]
        target_label: scheme
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'brainbytes_(.*)'
        target_label: metric_family
        replacement: '$1'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: node-exporter
          environment: development
    scrape_interval: 30s
    scrape_timeout: 10s
    honor_labels: false
    sample_limit: 15000
    target_limit: 5000
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):9100'
        target_label: instance
        replacement: '$1:9100'

  - job_name: 'grafana'
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: grafana
          environment: development
    scrape_interval: 60s
    scrape_timeout: 10s
    honor_labels: false
    sample_limit: 10000
    target_limit: 5000
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):3000'
        target_label: instance
        replacement: '$1:3000'
