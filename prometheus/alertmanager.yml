global:
  resolve_timeout: 5m

route:
  receiver: 'ops-team'
  group_by: ['severity', 'service', 'alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: 'ops-team'
    webhook_configs:
      - url: 'http://host.docker.internal:5001/alerts'
        send_resolved: true
