version: '3.8'

services:
  backend:
    build: ./backend
    container_name: brainbytes-backend
    environment:
      - PORT=${BACKEND_DOCKER_PORT:-5000}
      - MONGO_URI=${MONGO_URI}
    ports:
      - "${BACKEND_LOCAL_PORT:-5000}:${BACKEND_DOCKER_PORT:-5000}"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: brainbytes-frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "${FRONTEND_LOCAL_PORT:-3000}:${FRONTEND_DOCKER_PORT:-3000}"
    depends_on:
      - backend

  mongo:
    image: mongo:6.0
    container_name: brainbytes-mongo
    restart: unless-stopped
    # The database stays accessible inside Docker, but it is not exposed publicly
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: