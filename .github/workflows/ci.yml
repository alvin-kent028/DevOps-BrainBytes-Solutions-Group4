name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # SECURITY & LINTING (Fail Fast Phase)
  # ==========================================
  security_and_lint:
    name: Security & Code Quality Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Trufflehog)
        uses: trufflesecurity/trufflehog@v3.82.6
        with:
          extra_args: --only-verified

      - name: Initialize CodeQL Static Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Security Analysis
        uses: github/codeql-action/analyze@v3

  # ==========================================
  # BACKEND PIPELINE
  # ==========================================
  backend:
    name: Backend CI
    needs: security_and_lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run backend lint
        run: npm run lint

      - name: Backend Dependency Security Audit
        run: npm audit --audit-level=high --omit=dev

      - name: Backend Dependency Security Audit
        run: npm audit --audit-level=critical

      - name: Run backend integration & unit tests
        run: npm test
        env:
          MONGO_URI: mongodb://localhost:27017/test_db
          PORT: 5000

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: brainbytes-backend:ci-scan

      - name: Scan Backend Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: brainbytes-backend:ci-scan
          format: table
          # CRITICAL/HIGH CVEs fail the build; LOW/MEDIUM are reported but don't block.
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  # ==========================================
  # FRONTEND PIPELINE
  # ==========================================
  frontend:
    name: Frontend CI
    needs: security_and_lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run frontend lint
        run: npm run lint

      - name: Frontend Dependency Security Audit
        run: npm audit --audit-level=high --omit=dev

      - name: Frontend Dependency Security Audit
        run: npm audit --audit-level=critical

      - name: Run frontend tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: brainbytes-frontend:ci-scan

      - name: Scan Frontend Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: brainbytes-frontend:ci-scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  # ==========================================
  # AUTOMATED DEPLOYMENT & ROLLBACKS
  # ==========================================
  deploy:
    name: Continuous Deployment
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
       RAILWAY_TOKEN: '${{ secrets.RAILWAY_TOKEN }}'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cloud Deployment CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend Service to Cloud
        run: railway up --service "brainbytes-backend"
        working-directory: ./backend

      - name: Deploy Frontend Service to Cloud
        run: railway up --service "brainbytes-frontend"
        working-directory: ./frontend

      # ------------------------------------------------------------------
      # Post-deploy verification. Railway already refuses to route traffic
      # to a deployment whose healthcheckPath (/health, see railway.json)
      # never returns 200 — but that check happens inside Railway, silently.
      # This step makes the result visible in CI: if the new deployment
      # never reports healthy, the job fails loudly and the team knows to
      # roll back instead of finding out from a Discord message later.
      # ------------------------------------------------------------------
      - name: Verify Backend Deployment Health
        run: |
          echo "Polling backend health endpoint..."
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_PUBLIC_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy (attempt $i)."
              exit 0
            fi
            echo "Attempt $i: backend not healthy yet (HTTP $STATUS). Retrying in 10s..."
            sleep 10
          done
          echo "::error::Backend failed health check after deploy. Roll back via Railway dashboard (Deployments -> previous deployment -> Redeploy), or git revert the offending commit."
          exit 1