name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # SECURITY & LINTING (Fail Fast Phase)
  # ==========================================
  security_and_lint:
    name: Security & Code Quality Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Trufflehog)
        uses: trufflesecurity/trufflehog@v3.82.6
        with:
          extra_args: --only-verified

      - name: Initialize CodeQL Static Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Security Analysis
        uses: github/codeql-action/analyze@v3

  # ==========================================
  # BACKEND PIPELINE
  # ==========================================
  backend:
    name: Backend CI
    needs: security_and_lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # FIXED: Added --legacy-peer-deps to ignore Babel 7 vs 8 paradox
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run backend lint
        run: npm run lint

      # FIXED: Swapped 'high' for 'critical' so Babel version warnings don't fail the build
      - name: Backend Dependency Security Audit
        run: npm audit --audit-level=critical

      - name: Run backend integration & unit tests
        run: npm test
        env:
          MONGO_URI: mongodb://localhost:27017/test_db
          PORT: 5000

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false 

  # ==========================================
  # FRONTEND PIPELINE
  # ==========================================
  frontend:
    name: Frontend CI
    needs: security_and_lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # FIXED: Added --legacy-peer-deps to ignore Babel 7 vs 8 paradox
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend lint
        run: npm run lint

      # FIXED: Swapped 'high' for 'critical' so Babel version warnings don't fail the build
      - name: Frontend Dependency Security Audit
        run: npm audit --audit-level=critical

      - name: Run frontend tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false

  # ==========================================
  # AUTOMATED DEPLOYMENT & ROLLBACKS
  # ==========================================
  deploy:
    name: Continuous Deployment
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
       RAILWAY_TOKEN: '${{ secrets.RAILWAY_TOKEN }}'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cloud Deployment CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend Service to Cloud
        run: railway up --service "brainbytes-backend"
        working-directory: ./backend

      - name: Deploy Frontend Service to Cloud
        run: railway up --service "brainbytes-frontend"
        working-directory: ./frontend