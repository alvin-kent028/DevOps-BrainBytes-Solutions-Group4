<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BrainBytes Test UI</title>
  <style>
    :root{--bg:#f6f8fa;--accent:#0b64ff;--bubble-user:#e6f0ff;--bubble-ai:#ffffff}
    html,body{height:100%}
    body{font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;padding:18px;background:var(--bg);color:#111}
    .container{max-width:820px;margin:18px auto;background:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.06);overflow:hidden}
    header{padding:18px 20px;border-bottom:1px solid #eee;background:linear-gradient(90deg,#fff,#f9fbff)}
    header h2{margin:0;font-size:18px;color:var(--accent)}
    #messages{padding:16px;height:360px;overflow:auto;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#fbfdff,#ffffff)}
    .msg{max-width:78%;padding:10px 12px;border-radius:10px;line-height:1.35}
    .msg.user{align-self:flex-end;background:var(--bubble-user);border:1px solid rgba(11,100,255,0.08)}
    .msg.ai{align-self:flex-start;background:var(--bubble-ai);border:1px solid #eee}
    .meta{font-size:12px;color:#666;margin-bottom:6px}
    .composer{padding:12px;border-top:1px solid #eee;background:#fbfdff}
    textarea{width:100%;height:84px;border-radius:8px;border:1px solid #e6eef8;padding:10px;font-size:14px}
    .actions{display:flex;gap:8px;align-items:center;margin-top:8px}
    button{background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;border:0;cursor:pointer}
    button.secondary{background:#eef2ff;color:var(--accent);border:1px solid rgba(11,100,255,0.08)}
    .small{font-size:12px;color:#666}
  </style>
</head>
<body>
  <h2>BrainBytes — Test UI</h2>
  <div id="messages">Loading...</div>
  <div>
    <textarea id="text" placeholder="Ask the AI..."></textarea>
    <br />
    <button id="send">Send</button>
  </div>

  <script>
    const apiBase = '';
    const messagesEl = document.getElementById('messages');
    async function loadMessages(){
      try{
        const res = await fetch(apiBase + '/api/messages');
        const msgs = await res.json();
        if(!Array.isArray(msgs)) { messagesEl.textContent = JSON.stringify(msgs); return }
        messagesEl.innerHTML = msgs.map(m => `<div class="msg ${m.isUser? 'user' : 'ai'}"><strong>${m.isUser? 'User' : 'AI'}:</strong> ${escapeHtml(m.text)}</div>`).join('\n');
      }catch(e){ messagesEl.textContent = 'Failed to load messages: ' + e.message }
    }

    function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

    document.getElementById('send').addEventListener('click', async ()=>{
      const text = document.getElementById('text').value.trim();
      if(!text) return alert('Enter text');
      try{
        const res = await fetch(apiBase + '/api/messages', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ text })
        });
        if(!res.ok) throw new Error('Status ' + res.status);
        document.getElementById('text').value = '';
        await loadMessages();
      }catch(e){ alert('Send failed: ' + e.message) }
    });

    loadMessages();
    setInterval(loadMessages, 5000);
  </script>
</body>
</html>
